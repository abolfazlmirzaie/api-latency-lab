services:

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_latency_django
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

    command:
      - gunicorn
      - core.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "4"

  # ASGI service — used ONLY for the "async" scenario (BENCH-010).
  # Must be a separate process from the WSGI service above: a single
  # Gunicorn command cannot serve both core.wsgi and core.asgi at once,
  # and running the async view under WSGI (as before) defeats the whole
  # point of the benchmark.
  django-asgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_latency_django_asgi
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - gunicorn
      - core.asgi:application
      - -k
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:8001
      - --workers
      - "4"

  postgres:
    image: postgres:17-alpine
    container_name: api_latency_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: api_latency_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_latency_celery
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - celery
      - -A
      - core
      - worker
      - --loglevel=INFO

  locust-master:
    image: locustio/locust
    container_name: locust-master
    ports:
      - "8089:8089"
    volumes:
      - ./load_tests:/mnt/locust

    command:
      - -f
      - /mnt/locust
      - --master
    depends_on:
      - django
      - django-asgi

  locust-worker:
    image: locustio/locust
    container_name: locust-worker
    volumes:
      - ./load_tests:/mnt/locust
    command:
      - -f
      - /mnt/locust
      - --worker
      - --master-host=locust-master
    depends_on:
      - locust-master

volumes:
  postgres_data:
  redis_data: